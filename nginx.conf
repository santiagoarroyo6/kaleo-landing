server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  location ~* \.(jpg|png|svg|woff|mp4|ico|webp)$ { expires 7d; add_header Cache-Control "public"; add_header X-Robots-Tag "noindex, nofollow" always; }
  location ~* \.ics$ { default_type text/calendar; add_header Content-Disposition 'attachment; filename="kaleo-grand-opening.ics"'; add_header X-Robots-Tag "noindex, nofollow" always; }
  location / { try_files $uri $uri/ /index.html; }
}
